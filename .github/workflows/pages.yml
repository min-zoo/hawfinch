# 이 파일은 GitHub 이 알아서 웹사이트를 만들어 올리도록 시키는 지시서입니다.
# 저장소를 '공개'로 바꾸기만 하면 나머지는 자동으로 처리됩니다.
name: 웹사이트 배포

on:
  push:
    branches: [main]     # main 에 새 내용이 올라오면 자동 배포
  workflow_dispatch:      # 버튼으로 직접 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Pages 설정 (꺼져 있으면 자동으로 켬)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 파일 묶기
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
